services:
  openobserve:
    image: openobserve/openobserve:latest
    container_name: openobserve
    restart: always
    environment:
      - ZO_ROOT_USER_EMAIL=root@example.com
      - ZO_ROOT_USER_PASSWORD=ComplexPassword123
      - ZO_DATA_DIR=/data
      - ZO_HTTP_PORT=5080
      - ZO_GRPC_PORT=5081
      - ZO_TELEMETRY_ENABLED=true
    ports:
      - "5080:5080" # Web UI & HTTP Ingestion (Logs, Traces, Metrics)
      - "5081:5081" # High-Performance gRPC OTLP Port
    volumes:
      - openobserve-data:/data

volumes:
  openobserve-data:
